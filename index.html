    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --cream: #F5F0E8; --taupe: #B89A78; --dark: #1E1810;
      --mid: #7A6A56; --light-mid: #A89880; --border: #DDD5C8; --white: #FAFAF7;
    }
    body { font-family: 'Jost', sans-serif; background: var(--white); color: var(--dark); font-weight: 300; }
    .page { display: block; } .page.hidden { display: none; }

    .nav { position: sticky; top: 0; z-index: 200; display: flex; justify-content: space-between; align-items: center; padding: 14px 40px; background: var(--white); border-bottom: 0.5px solid var(--border); }
    .nav-side { width: 90px; display: flex; align-items: center; }
    .nav-logo { display: flex; flex-direction: column; align-items: center; }
    .nav-logo img.real-logo { height: 72px; width: auto; object-fit: contain; display: block; }
    .logo-fallback { display: none; flex-direction: column; align-items: center; gap: 2px; }
    .logo-fallback .lf-m { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 400; letter-spacing: 2px; color: var(--dark); line-height: 1; }
    .logo-fallback .lf-sub { font-size: 8px; letter-spacing: 6px; color: var(--dark); }
    .nav-right { justify-content: flex-end; gap: 12px; }
    .lang-btn { font-size: 11px; letter-spacing: 2px; color: var(--light-mid); cursor: pointer; background: none; border: none; font-family: 'Jost', sans-serif; font-weight: 400; padding: 2px 0; }
    .lang-btn.active { color: var(--dark); border-bottom: 0.5px solid var(--dark); }
    .back-btn { font-size: 11px; letter-spacing: 2px; color: var(--mid); cursor: pointer; background: none; border: none; font-family: 'Jost', sans-serif; font-weight: 300; }
    .back-btn:hover { color: var(--dark); }

    .hero { background: var(--cream); padding: 52px 40px 44px; text-align: center; border-bottom: 0.5px solid var(--border); }
    .hero-tag { font-size: 9px; letter-spacing: 6px; color: var(--taupe); margin-bottom: 14px; }
    .hero-title { font-family: 'Cormorant Garamond', serif; font-size: 14px; font-weight: 400; letter-spacing: 10px; color: var(--dark); margin-bottom: 14px; }
    .hero-line { width: 48px; height: 0.5px; background: var(--taupe); margin: 0 auto 14px; }
    .hero-sub { font-size: 11px; letter-spacing: 3px; color: var(--mid); }

    .filters-wrap { background: var(--white); border-bottom: 0.5px solid var(--border); padding: 0 32px; }
    .filters-inner { display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; }
    .filters-inner::-webkit-scrollbar { display: none; }
    .filter-group { display: flex; flex-direction: column; padding: 16px 24px 16px 0; min-width: fit-content; border-right: 0.5px solid var(--border); margin-right: 24px; }
    .filter-group:last-child { border-right: none; }
    .filter-group-label { font-size: 8px; letter-spacing: 3px; color: var(--light-mid); margin-bottom: 10px; white-space: nowrap; }
    .filter-chips { display: flex; gap: 6px; flex-wrap: nowrap; }
    .chip { font-size: 10px; letter-spacing: 1px; padding: 5px 12px; border: 0.5px solid var(--border); cursor: pointer; background: transparent; color: var(--mid); font-family: 'Jost', sans-serif; font-weight: 300; white-space: nowrap; transition: all 0.15s; border-radius: 1px; }
    .chip:hover { border-color: var(--dark); color: var(--dark); }
    .chip.active { background: var(--dark); color: #fff; border-color: var(--dark); }
    .chip.color-chip { display: flex; align-items: center; gap: 6px; }
    .color-dot { width: 10px; height: 10px; border-radius: 50%; border: 0.5px solid rgba(0,0,0,0.15); flex-shrink: 0; }

    .results-bar { padding: 12px 32px; display: flex; justify-content: space-between; align-items: center; }
    .results-count { font-size: 10px; letter-spacing: 2px; color: var(--light-mid); }
    .clear-btn { font-size: 10px; letter-spacing: 1px; color: var(--taupe); cursor: pointer; background: none; border: none; font-family: 'Jost', sans-serif; display: none; }
    .clear-btn.visible { display: block; }

    .products-section { padding: 8px 32px 60px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
    .no-results { text-align: center; padding: 60px 20px; font-size: 12px; letter-spacing: 2px; color: var(--light-mid); display: none; }
    .no-results.visible { display: block; }

    .card { background: #fff; border: 0.5px solid var(--border); border-radius: 1px; overflow: hidden; cursor: pointer; transition: box-shadow 0.2s; }
    .card:hover { box-shadow: 0 4px 24px rgba(0,0,0,0.07); }
    .card:hover .card-img img { transform: scale(1.04); }
    .card-img { width: 100%; aspect-ratio: 1/1; overflow: hidden; background: var(--cream); }
    .card-img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
    .card-body { padding: 14px 15px 17px; }
    .badge { display: inline-block; font-size: 8px; letter-spacing: 2px; padding: 3px 9px; margin-bottom: 8px; }
    .badge-new { background: var(--dark); color: #fff; }
    .badge-sale { background: var(--taupe); color: #fff; }
    .card-name { font-size: 12px; color: var(--dark); margin-bottom: 6px; line-height: 1.6; }
    .card-price { font-size: 14px; color: var(--dark); font-weight: 400; }
    .card-price .old { font-size: 11px; color: var(--light-mid); text-decoration: line-through; margin-left: 6px; font-weight: 300; }

    .product-section { padding: 40px 32px 60px; max-width: 960px; margin: 0 auto; }
    .product-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 52px; align-items: start; }
    .product-imgs { display: flex; flex-direction: column; gap: 10px; }
    .main-img-wrap { width: 100%; aspect-ratio: 1/1; overflow: hidden; background: var(--cream); border: 0.5px solid var(--border); }
    .main-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .thumb { width: 68px; height: 68px; object-fit: cover; border: 0.5px solid var(--border); cursor: pointer; opacity: 0.6; transition: opacity 0.2s; }
    .thumb.active, .thumb:hover { opacity: 1; border-color: var(--dark); }
    .product-info { padding-top: 4px; }
    .product-badge { display: inline-block; font-size: 8px; letter-spacing: 2px; padding: 3px 10px; margin-bottom: 16px; }
    .product-name { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400; color: var(--dark); margin-bottom: 14px; line-height: 1.5; }
    .product-price { font-size: 22px; color: var(--dark); margin-bottom: 5px; font-weight: 400; }
    .product-price .old { font-size: 15px; color: var(--light-mid); text-decoration: line-through; margin-left: 8px; font-weight: 300; }
    .product-credit { font-size: 11px; color: var(--mid); margin-bottom: 26px; letter-spacing: 0.5px; }
    .divider { height: 0.5px; background: var(--border); margin: 22px 0; }
    .buy-label { font-size: 9px; letter-spacing: 4px; color: var(--light-mid); margin-bottom: 14px; }
    .btn-group { display: flex; flex-direction: column; gap: 10px; }
    .btn { display: block; text-align: center; padding: 14px 16px; font-size: 11px; letter-spacing: 2.5px; cursor: pointer; text-decoration: none; border: 0.5px solid; font-family: 'Jost', sans-serif; font-weight: 400; transition: background 0.2s; }
    .btn-primary { background: var(--dark); color: #fff; border-color: var(--dark); }
    .btn-primary:hover { background: #3a2e1e; }
    .btn-secondary { background: transparent; color: var(--mid); border-color: #C4B8A8; }
    .btn-secondary:hover { background: var(--cream); }
    .product-detail { margin-top: 20px; font-size: 12px; color: var(--mid); line-height: 2; letter-spacing: 0.5px; }
    .footer { padding: 28px 40px; border-top: 0.5px solid var(--border); background: var(--cream); text-align: center; font-size: 9px; letter-spacing: 4px; color: var(--light-mid); }

  const clearBtn = document.getElementById('clear-btn');
  grid.innerHTML = '';
  const lang = currentLang;

  const filtered = products.filter(p => {
    if (activeFilters.type !== 'all' && p.type !== activeFilters.type) return false;
    if (activeFilters.status && p.badge !== activeFilters.status) return false;
    
    if (activeFilters.priceMin !== null && p.price < activeFilters.priceMin) return false;
    if (activeFilters.priceMax !== null && p.price > activeFilters.priceMax) return false;
    if (activeFilters.color !== 'all' && p.color !== activeFilters.color) return false;
    return true;
  });

  const hasActive = activeFilters.type!=='all' || activeFilters.status!==null || activeFilters.priceMin!==null || activeFilters.priceMax!==null || activeFilters.color!=='all';
  clearBtn.classList.toggle('visible', hasActive);
  clearBtn.textContent = lang==='az' ? 'Filtrləri sıfırla' : 'Сбросить фильтры';
  countEl.textContent = lang==='az' ? `${filtered.length} məhsul` : `${filtered.length} товаров`;

  if (filtered.length === 0) { noResults.classList.add('visible'); return; }
  noResults.classList.remove('visible');
  noResults.textContent = lang==='az' ? 'Heç bir məhsul tapılmadı' : 'Ничего не найдено';

  filtered.forEach(p => {
    const origIdx = products.indexOf(p);
    const div = document.createElement('div');
    div.className = 'card';
    div.onclick = () => openProduct(origIdx);
    const badgeText = p.badge==='new' ? (lang==='az'?'YENİLİK':'НОВИНКА') : (lang==='az'?'ENDİRİM':'СКИДКА');
    div.innerHTML = `
      <div class="card-img"><img src="${CDN}840/${p.imgs[0]}.jpeg?quality=90" alt="çanta" loading="lazy"/></div>
      <div class="card-body">
        <span class="badge ${p.badge==='new'?'badge-new':'badge-sale'}">${badgeText}</span>
        <div class="card-name">${p.name[lang]}</div>
        <div class="card-price">${p.price.toFixed(2)} ₼${p.old?` <span class="old">${p.old}</span>`:''}</div>
      </div>`;
    grid.appendChild(div);
  });
}

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const ft = chip.dataset.filter;
    const val = chip.dataset.value;
    if (ft === 'status') {
      if (chip.classList.contains('active')) { chip.classList.remove('active'); activeFilters.status = null; }
      else { document.querySelectorAll('[data-filter="status"]').forEach(c=>c.classList.remove('active')); chip.classList.add('active'); activeFilters.status = val; }
    } else {
      document.querySelectorAll(`[data-filter="${ft}"]`).forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      activeFilters[ft] = val;
    }
    buildGrid();
  });
});

function applyPriceFilter() {
  const minVal = document.getElementById('price-min').value;
  const maxVal = document.getElementById('price-max').value;
  activeFilters.priceMin = minVal !== '' ? parseFloat(minVal) : null;
  activeFilters.priceMax = maxVal !== '' ? parseFloat(maxVal) : null;
  const clearBtn = document.getElementById('price-clear');
  clearBtn.style.display = (activeFilters.priceMin !== null || activeFilters.priceMax !== null) ? 'block' : 'none';
  buildGrid();
}

function clearPriceFilter() {
  document.getElementById('price-min').value = '';
  document.getElementById('price-max').value = '';
  activeFilters.priceMin = null;
  activeFilters.priceMax = null;
  document.getElementById('price-clear').style.display = 'none';
  buildGrid();
}

function clearFilters() {
  activeFilters = { type:'all', status:null, priceMin:null, priceMax:null, color:'all' };
  document.querySelectorAll('[data-filter="type"][data-value="all"]').forEach(c=>c.classList.add('active'));
  document.querySelectorAll('[data-filter="color"][data-value="all"]').forEach(c=>c.classList.add('active'));
  document.querySelectorAll('[data-filter="status"]').forEach(c=>c.classList.remove('active'));
  document.getElementById('price-min').value = '';
  document.getElementById('price-max').value = '';
  document.getElementById('price-clear').style.display = 'none';
  buildGrid();
}

function openProduct(i) {
  const p = products[i];
  const lang = currentLang;
  const mainImg = document.getElementById('prod-main-img');
  mainImg.src = `${CDN}840/${p.imgs[0]}.jpeg?quality=90`;
  const thumbRow = document.getElementById('thumb-row');
  thumbRow.innerHTML = '';
  p.imgs.forEach((id, ti) => {
    const t = document.createElement('img');
    t.className = 'thumb'+(ti===0?' active':'');
    t.src = `${CDN}280/${id}.jpeg?quality=80`;
    t.onclick = () => { mainImg.src=`${CDN}840/${id}.jpeg?quality=90`; thumbRow.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active')); t.classList.add('active'); };
    thumbRow.appendChild(t);
  });
  document.getElementById('prod-name').textContent = p.name[lang];
  document.getElementById('prod-price').innerHTML = p.price.toFixed(2)+' ₼'+(p.old?` <span class="old">${p.old}</span>`:'');
  document.getElementById('prod-credit').textContent = p.credit ? (lang==='az'?`və ya ${p.credit} (kredit)`:`или ${p.credit} (кредит)`) : '';
  const badge = document.getElementById('prod-badge');
  badge.textContent = p.badge==='new'?(lang==='az'?'YENİLİK':'НОВИНКА'):(lang==='az'?'ENDİRİM':'СКИДКА');
  badge.className = 'product-badge '+(p.badge==='new'?'badge-new':'badge-sale');
  document.getElementById('prod-birmarket').href = p.link;
  document.getElementById('prod-whatsapp').href = `https://wa.me/9943430340?text=${encodeURIComponent('Salam! '+p.name.az+' məhsulu barədə məlumat almaq istəyirəm.')}`;
  document.getElementById('prod-detail').textContent = p.detail[lang];
  document.getElementById('home-page').classList.add('hidden');
  document.getElementById('product-page').classList.remove('hidden');
  window.scrollTo(0,0);
  applyLangStatic();
}

function goHome() {
  document.getElementById('product-page').classList.add('hidden');
  document.getElementById('home-page').classList.remove('hidden');
  window.scrollTo(0,0);
}

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.toggle('active', btn.textContent.toLowerCase()===lang));
  applyLangStatic();
  buildGrid();
}

function applyLangStatic() {
  const lang = currentLang;
  document.querySelectorAll('[data-az]:not(.chip):not(.filter-group-label)').forEach(el => {
    el.textContent = el.dataset[lang] || el.dataset.az;
  });
  document.querySelectorAll('.filter-group-label[data-az]').forEach(el => {
    el.textContent = el.dataset[lang] || el.dataset.az;
  });
  document.querySelectorAll('.chip[data-az]').forEach(el => {
    if (!el.querySelector('.color-dot')) el.textContent = el.dataset[lang] || el.dataset.az;
  });
}

buildGrid();
</script>
</body>
</html>
